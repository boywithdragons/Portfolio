<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Portfolio OS preview with a lavender glass interface and PowerShell theme panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F3FF" />
      <stop offset="0.55" stop-color="#EDE9FE" />
      <stop offset="1" stop-color="#F3E8FF" />
    </linearGradient>
    <linearGradient id="iridescent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD" stop-opacity="0.9" />
      <stop offset="0.33" stop-color="#FBCFE8" stop-opacity="0.85" />
      <stop offset="0.66" stop-color="#99F6E4" stop-opacity="0.7" />
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED" />
      <stop offset="1" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1E1B4B" />
      <stop offset="1" stop-color="#4C1D95" />
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#A78BFA" stop-opacity="0.55" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F9A8D4" stop-opacity="0.5" />
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#312E81" flood-opacity="0.12" />
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="286" y="122" width="854" height="514" rx="20" />
    </clipPath>
  </defs>

