<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Memoji illustration of Aditya">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="160" cy="160" r="158" />
    </clipPath>
    <linearGradient id="bg" x1="38" y1="16" x2="284" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDE9FE" />
      <stop offset="0.5" stop-color="#DDD6FE" />
      <stop offset="1" stop-color="#C4B5FD" />
    </linearGradient>
    <linearGradient id="hoodie" x1="88" y1="248" x2="230" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B1F73" />
      <stop offset="1" stop-color="#22124A" />
    </linearGradient>
    <linearGradient id="skin" x1="120" y1="100" x2="215" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2C7A5" />
      <stop offset="1" stop-color="#D99C74" />
    </linearGradient>
    <linearGradient id="hair" x1="110" y1="76" x2="212" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A214F" />
      <stop offset="1" stop-color="#171230" />
    </linearGradient>
    <radialGradient id="pinkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FB7FC8" stop-opacity="0.7" />
      <stop offset="1" stop-color="#FB7FC8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#5EEAD4" stop-opacity="0.75" />
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="yellowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FDE68A" stop-opacity="0.85" />
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0" />
    </radialGradient>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312E81" flood-opacity="0.28" />
    </filter>
  </defs>

  <g clip-path="url(#avatarClip)">
    <rect width="320" height="320" fill="url(#bg)" />

    <circle cx="70" cy="74" r="76" fill="url(#pinkGlow)" filter="url(#blur24)" />
    <circle cx="262" cy="92" r="70" fill="url(#tealGlow)" filter="url(#blur24)" />
    <circle cx="250" cy="262" r="84" fill="url(#yellowGlow)" filter="url(#blur24)" />
    <circle cx="48" cy="254" r="64" fill="url(#pinkGlow)" filter="url(#blur24)" opacity="0.55" />

    <g opacity="0.35" stroke="#4C1D95" stroke-width="1">
      <circle cx="160" cy="160" r="126" fill="none" stroke-dasharray="2 8" />
      <circle cx="160" cy="160" r="142" fill="none" stroke-dasharray="1 12" opacity="0.5" />
    </g>

    <!-- shoulders and hoodie -->
    <path d="M34 322C38 274 74 243 116 230H204C246 243 282 274 286 322H34Z" fill="url(#hoodie)" filter="url(#shadow)" />
    <path d="M120 230C132 244 188 244 200 230L211 238C197 257 177 264 160 264C143 264 123 257 109 238L120 230Z" fill="#4C1D95" />
    <path d="M126 262C138 272 182 272 194 262L196 276C181 286 139 286 124 276L126 262Z" fill="#2B1756" opacity="0.8" />

    <!-- neck -->
    <path d="M131 205H189V232C189 248 175 258 160 258C145 258 131 248 131 232V205Z" fill="#C98B63" />
    <path d="M131 205H189V218C175 229 145 229 131 218V205Z" fill="#B77851" opacity="0.7" />

    <!-- ears -->
    <ellipse cx="96" cy="161" rx="14" ry="19" fill="#E7B48D" />
    <ellipse cx="224" cy="161" rx="14" ry="19" fill="#E7B48D" />
    <path d="M92 156C96 154 100 156 101 161C102 166 99 170 95 171" fill="none" stroke="#C98B63" stroke-width="3" stroke-linecap="round" />
    <path d="M228 156C224 154 220 156 219 161C218 166 221 170 225 171" fill="none" stroke="#C98B63" stroke-width="3" stroke-linecap="round" />

    <!-- face -->
    <path d="M160 82C121 82 100 111 100 154C100 198 126 230 160 230C194 230 220 198 220 154C220 111 199 82 160 82Z" fill="url(#skin)" />

    <!-- hair -->
    <path d="M96 154C89 103 120 70 160 70C200 70 231 103 224 154C220 131 212 115 199 105C181 119 146 124 112 116C103 124 99 137 96 154Z" fill="url(#hair)" />
    <path d="M110 112C123 86 148 76 171 78C148 78 127 89 118 106C115 108 112 110 110 112Z" fill="#4A3B7A" opacity="0.65" />
    <path d="M101 148C99 128 104 112 113 100C107 117 107 133 108 151L101 148Z" fill="#171230" />
    <path d="M219 148C221 128 216 112 207 100C213 117 213 133 212 151L219 148Z" fill="#171230" />

    <!-- eyebrows -->
    <path d="M122 139C130 134 143 134 151 138" fill="none" stroke="#241C4B" stroke-width="5" stroke-linecap="round" />
    <path d="M169 138C177 134 190 134 198 139" fill="none" stroke="#241C4B" stroke-width="5" stroke-linecap="round" />

    <!-- glasses -->
    <rect x="112" y="145" width="40" height="30" rx="13" fill="#EEF2FF" fill-opacity="0.26" stroke="#221A44" stroke-width="5" />
    <rect x="168" y="145" width="40" height="30" rx="13" fill="#EEF2FF" fill-opacity="0.26" stroke="#221A44" stroke-width="5" />
    <path d="M152 158C156 155 164 155 168 158" fill="none" stroke="#221A44" stroke-width="4" stroke-linecap="round" />
    <path d="M108 154L101 151" stroke="#221A44" stroke-width="4" stroke-linecap="round" />
    <path d="M212 154L219 151" stroke="#221A44" stroke-width="4" stroke-linecap="round" />
    <path d="M119 151L130 149" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round" />
    <path d="M175 151L186 149" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round" />

    <!-- eyes -->
    <ellipse cx="133" cy="160" rx="3.4" ry="4.2" fill="#1D1638" />
    <ellipse cx="189" cy="160" rx="3.4" ry="4.2" fill="#1D1638" />
    <circle cx="134" cy="159" r="1" fill="#FFFFFF" />
    <circle cx="190" cy="159" r="1" fill="#FFFFFF" />

    <!-- nose -->
    <path d="M160 165C158 172 156 176 160 178" fill="none" stroke="#B77851" stroke-width="3" stroke-linecap="round" />

    <!-- smile -->
    <path d="M145 193C152 201 168 201 175 193" fill="none" stroke="#8A4B32" stroke-width="4" stroke-linecap="round" />
    <path d="M147 194C153 199 167 199 173 194" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />

    <!-- blush -->
    <ellipse cx="116" cy="181" rx="9" ry="5" fill="#E88989" opacity="0.3" />
    <ellipse cx="204" cy="181" rx="9" ry="5" fill="#E88989" opacity="0.3" />

    <!-- shirt highlight -->
    <path d="M121 300C128 282 145 274 160 274C175 274 192 282 199 300" fill="none" stroke="#6D28D9" stroke-width="2" opacity="0.8" />
    <circle cx="160" cy="298" r="9" fill="none" stroke="#DDD6FE" stroke-width="1.5" opacity="0.35" />
    <path d="M156 302L160 290L164 302M157.5 298H162.5" fill="none" stroke="#DDD6FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>

  <circle cx="160" cy="160" r="157" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" />
</svg>
